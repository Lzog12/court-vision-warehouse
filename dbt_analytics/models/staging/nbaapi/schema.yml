
version: 2

models:

  - name: stg_nbaapi__player_shots
    description: >
      Staging model for player shot data from the NBA API ShotChartDetail endpoint.
      Cleans and standardises the raw shot-level data loaded from the raw schema - one row per nba shot attempt.

    columns:
      - name: player_id_nk
        description: Id of the player that took the shot, returned by nba_api.
        data_tests:
          - not_null


      - name: player_name
        description: Name of the player that took the shot, returned by nba_api.
        data_tests:
          - not_null
      
      - name: team_id_nk
        description: NBA team identifier
        data_tests:
          - not_null

      - name: team_name
        description: NBA team name (full name)
        data_tests:
          - not_null

      - name: game_id_nk
        description: Natural key identifying the NBA game
        data_tests:
          - not_null

      - name: htm
        description: 3 letter abbreviation of the home team
        data_tests:
          - not_null

      - name: vtm
        description: 3 letter abbreviation of the visiting team
        data_tests:
          - not_null

      - name: game_date
        description: Date on which the game was played
        data_tests:
          - not_null

      - name: season
        description: Season in which the game was played
        data_tests:
          - not_null

      - name: shot_id_nk
        description: >
          Natural key for a shot attempt, created by combining game_id and game_event_id
        data_tests:
          - not_null
          - unique

      - name: game_event_id_nk
        description: The natural key from nba_api for the unique game event in a game
        data_tests:
          - not_null

      - name: event_type
        description: Indicates either 'missed shot' or 'made shot'
        data_tests:
          - not_null

      - name: action_type
        description: Type of basketball action implemented to take the shot
        data_tests:
          - not_null

      - name: shot_type
        description: Indicates 2pt or 3pt attempt
        data_tests:
          - not_null

      - name: shot_zone_basic
        description: >
          Shot is assigned to a specific shot zone on a basketball court
          Restricted area
          Above the break 3
          Mid-range
          In The Paint (Non-RA)
        data_tests:
          - not_null

      - name: shot_zone_area
        description: Indicates area on the court where shot was taken with a combination of [left, right, center]
        data_tests:
          - not_null

      - name: shot_zone_range
        description: Gives a rough range where shot was taken from (feet)
        data_tests:
          - not_null

      - name: shot_distance
        description: Exact shot distance (feet) from the basket
        data_tests:
          - not_null

      - name: loc_x
        description: Exact x-axis on the court where shot was taken from
        data_tests:
          - not_null

      - name: loc_y
        description: Exact y-axis on the court where shot was taken from
        data_tests:
          - not_null

      - name: is_bucket
        description: Indicates whether the shot was made or not with a 0 or 1
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false #Ensures it will NOT single-quote the list of accepted values
      
      - name: period_no
        description: Period of the game that the shot was taken in
        data_tests:
          - not_null
      
      - name: min_left
        description: Minutes left in the quarter when the shot was taken
        data_tests:
          - not_null

      - name: sec_left
        description: Seconds (+ minute) left in the quarter when the shot was taken
        data_tests:
          - not_null


  - name: stg_nbaapi__play_by_play
    description: >
      Staging model for shot events from the NBA API PlayByPlayV3 endpoint.
      Filters the raw play-by-play feed to field goal attempts and free throws only and standardises 
      the relevant shot-level fields

    columns:
      - name: season
        description: Season in which the game was played
        data_tests:
          - not_null
      
      - name: season_segment
        description: Season segment (regular season, playoffs) in which the game was played
        data_tests:
          - not_null

      - name: player_id_nk
        description: Id of the player that took the shot, returned by nba_api.
        data_tests:
          - not_null
      
      - name: team_id_nk
        description: Id of the team of player that took the shot, returned by nba_api.
        data_tests:
          - not_null

      - name: shot_id_nk
        description: >
          Natural id of the shot taken, derived from 'actionNumber' in nba_api. 
          Combination of game_id and game_event_id
        data_tests:
          - not_null
          - unique

      - name: game_id_nk
        description: Natural key identifying the NBA game
        data_tests:
        - not_null


      - name: shot_value
        description: Amount of points rewarded for the made shot
      
      - name: period_no
        description: Period of the game at the time of the action

      - name: clock
        description: Time string in the format 'PT11M47.00S'
      
      - name: min_left
        description: Minutes left when the action (shot) was taken
      
      - name: sec_left
        description: Seconds (of the minute) left when the action (shot) was taken

      - name: home_pts
        description: Amount of points accumulated by the home team at the time of that game_event_id

      - name: away_pts
        description: Amount of points accumulated by the away team at the time of that game_event_id

      - name: team_location
        description: h or v value indicating the action associated player's home or away status

      - name: is_fg
        description: Indicates 1 or 0 whether the action was a field goal attempt. (can also 0 for free throw attempt)

      - name: shot_value_original
        description: Indicates potential shot value, regardless of miss

      - name: shot_value_new
        description: Same as shot_value_original but considers free throw value as well

      - name: points_scored
        description: Actual points scored from the attempt, field goal or free throw

      - name: descr
        description: >
          Description of the shot action eg.
          Spencer 20' Step Back Jump Shot (2 PTS)
          MISS Landale Free Throw 2 of 2

      - name: action_type
        description: Made Shot, Missed Shot or Free Throw

      - name: sub_tybe
        description: > 
          Indicates sub action type eg.
          Free Throw 1 of 2
          Step Back Jump shot
          Driving Floating Jump Shot
          Turnaround Hook Shot

      - name: shot_value
        description: Amount of points rewarded for the made shot

  - name: stg_nbaapi__player_game
    description: >
      Staging model for individual player game statistics.
      One row per player per game.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id_nk
              - game_id_nk

    columns:
      - name: player_id_nk
        description: Id of the player that played the game.
        data_tests:
          - not_null

      - name: game_id_nk
        description: Game in which the player played in
        data_tests:
          - not_null
      
      - name: season_id_nk
        description: Id of the season returned by nba_api
      
      - name: season
        description: Season in which the game was played
        data_tests:
          - not_null
      
      - name: season_segment
        description: Season segment (regular season, playoffs) in which the game was played
        data_tests:
          - not_null
      
      - name: min
        description: Minutes played by the player
      
      - name: fgm
        description: Field goals made by the player

      - name: fga
        description: Field goal attempts by the player

      - name: fg3m
        description: 3pt field goals made by the player

      - name: fg3a
        description: 3pt field goals attempts by the player

      - name: pts
        description: Total points scored by the player

      - name: plus_minus
        description: >
          Player plus-minus for the game, representing the team's point differential
          while the player was on the court.


  - name: stg_nbaapi__league_game
    description: >
      Staging model for team-level game statistics.
      One row per team per game, resulting in two rows for each NBA game.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id_nk
              - game_id_nk

    columns:
      - name: team_id_nk
        description: Id of the team that played the game.
        data_tests:
          - not_null

      - name: game_id_nk
        description: Game in which the team played in
        data_tests:
          - not_null
      
      - name: game_date
        description: Date of the game
        data_tests:
          - not_null

      - name: team_abbrev
        description: Team name abbreviation
        data_tests:
          - not_null

      - name: season_id_nk
        description: Id of the season returned by nba_api
      
      - name: season
        description: Season in which the game was played
        data_tests:
          - not_null
      
      - name: season_segment
        description: Season segment (regular season, playoffs) in which the game was played
        data_tests:
          - not_null
      
      - name: matchup
        description: >
          NBA API matchup label identifying the opposing teams and whether the team
          played at home or away, for example "LAL vs. BOS" or "BOS @ LAL".

      - name: result
        description: >
          Game result from the perspective of the team represented by the row.
          W indicates a win and L indicates a loss.
        data_tests:
          - accepted_values:
              arguments:
                values: ['W', 'L']
                quote: true

      - name: points
        description: Total points scored by the team
